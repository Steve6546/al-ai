<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AL AI — لوحة التحكم</title>
    <meta name="description" content="لوحة تحكم AL AI — إدارة سيرفرات ديسكورد وإعدادات البوت." />
    <!-- An admin panel behind a Discord sign-in has nothing to be indexed for,
         and a tunnel URL can be handed to anyone: say so to every crawler. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />
    <!--
      The appearance is applied before the first paint, by a file on this
      origin rather than an inline script: the dashboard's own
      Content-Security-Policy is `script-src 'self'`, and an inline script is
      blocked by it - which would show the wrong palette for a moment and then
      correct it. `public/theme-boot.js` is the same code, allowed because it
      is served from here.
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <!--
      The boot fallback is real HTML, not a React component: if the module
      script is missing, served with the wrong MIME type, or blocked on the
      way here, the page must say so instead of showing a white rectangle.
      React replaces this subtree on mount, so it never appears in a healthy
      load. System colours keep it readable in either palette.
    -->
    <div id="root">
      <div
        id="boot-fallback"
        role="status"
        aria-live="polite"
        style="min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;text-align:center;padding:24px"
      >
        <div style="max-width:32rem;line-height:1.9">
          <p style="margin:0 0 8px;font-size:1.125rem;font-weight:600">جارٍ تحميل لوحة التحكم…</p>
          <p id="boot-fallback-detail" style="margin:0;color:GrayText;font-size:0.875rem">إذا استمر هذا، حدّث الصفحة.</p>
          <noscript>
            <p style="margin:12px 0 0;color:#b91c1c;font-weight:600">تحتاج هذه اللوحة إلى JavaScript.</p>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
