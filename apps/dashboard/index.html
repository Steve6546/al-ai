<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AL AI — لوحة التحكم</title>
    <meta name="description" content="لوحة تحكم AL AI — إدارة سيرفرات ديسكورد وإعدادات البوت." />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The appearance is applied before the first paint, by a file on this
      origin rather than an inline script: the dashboard's own
      Content-Security-Policy is `script-src 'self'`, and an inline script is
      blocked by it - which would show the wrong palette for a moment and then
      correct it. `public/theme-boot.js` is the same code, allowed because it
      is served from here.
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
