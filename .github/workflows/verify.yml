# The quality gate, run on every push and pull request.
#
# Five rules this workflow follows:
#
# 1. `npm ci`, never `npm install`: the lockfile is the contract, and `install`
#    is free to rewrite it. A green build that installed something else is not
#    a green build.
# 2. The actions are pinned to a commit SHA, not to a tag: a tag can be moved,
#    and a workflow that runs someone else's code is a supply-chain hole. The
#    version comment next to each SHA is the release it came from.
# 3. The token gets the least it can do: `contents: read` and nothing else.
# 4. The Node versions are the two the project declares - the minimum it
#    supports (`.nvmrc` holds the version it is developed on) - so a release
#    that breaks the floor fails here, not in a deployment.
# 5. No secret is ever needed: the checks below are static (lint, types,
#    schema, tests, build, secret gate, dependency audit, dead code). The
#    database-backed check (`db:verify`) is deliberately *not* here - it needs a
#    real PostgreSQL with the project's credentials, which is a deployment
#    concern, not a pull-request one. `npm run db:verify` runs against a real
#    database in the deployment pipeline.
# 6. `fetch-depth: 0`, and the audit step is not the same audit `npm run verify`
#    runs. The secret gate scans the diff of every ref in the history, and a
#    default checkout hands it one commit - a shallow clone makes that surface
#    report clean while reading almost nothing, so the gate now fails loudly
#    instead (verified: the same script run in a `--depth 1` clone exits 1). The
#    step below covers dev dependencies too; `npm run audit` is `--omit=dev`,
#    because a build-time package with a high advisory is a supply-chain hole
#    even when it never ships.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  # Manual run from Actions -> Verify -> Run workflow. It exists because the
  # automatic triggers are not always available - when the account cannot start
  # runners, this is the way to prove a workflow is correct the moment it can -
  # and because a gate that only runs on push cannot be re-run against a branch
  # on purpose.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24.22.1"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The secret gate reads the diff of every ref; the default single-commit
          # checkout would let it report a clean history it never looked at.
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install the locked tree
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Audit the dependencies
        run: npm audit --audit-level=high

      - name: Lint, schema, tests, build
        run: npm run verify

      - name: Dead code and unused dependencies
        run: npm run check:dead

  dashboard-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install the locked tree
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build the dashboard
        run: npm run build --workspace=@al-ai/dashboard

      - name: Upload the built dashboard
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          retention-days: 7
